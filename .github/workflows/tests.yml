name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Install desktop retrieval on Windows Python 3.10
        if: matrix.os == 'windows-latest' && matrix.python == '3.10'
        run: python -m pip install -e ".[live]"
      - name: Prepare Windows test browser
        if: matrix.os == 'windows-latest' && matrix.python == '3.10'
        run: python -m playwright install chromium
      - name: Verify actual desktop collector on Windows
        if: matrix.os == 'windows-latest' && matrix.python == '3.10'
        run: python -m tests.desktop_browser_check
