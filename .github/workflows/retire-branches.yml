name: Retire superseded branches
on:
  pull_request:
    branches: [main]
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/cross-platform-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify containment and retire unchanged inactive heads
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/retire-branches.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-retirement-report-${{ github.run_attempt }}
          path: branch-retirement.json
