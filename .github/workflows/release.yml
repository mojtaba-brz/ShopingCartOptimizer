name: Downloadable release
on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/**']
    paths:
      - '.github/workflows/release.yml'
      - 'release/windows-entry.py'
      - 'release/check-windows.py'
      - 'cartoptimizer/release.json'
permissions:
  contents: read
concurrency:
  group: downloadable-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install ".[live]" pyinstaller==6.22.3
      - name: Ensure the test browser is available
        run: python -m playwright install msedge
      - name: Build portable Windows executable
        shell: pwsh
        run: |
          $version = (Get-Content cartoptimizer/release.json | ConvertFrom-Json).version
          python -m PyInstaller --noconfirm --clean --onefile --console --noupx --name "Sabadchin-Windows-$version" --collect-all cartoptimizer --collect-all playwright release/windows-entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the packaged executable
        shell: pwsh
        run: |
          $version = (Get-Content cartoptimizer/release.json | ConvertFrom-Json).version
          python release/check-windows.py "dist/Sabadchin-Windows-$version.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check live retrieval through the packaged Windows server
        continue-on-error: true
        shell: pwsh
        run: |
          $version = (Get-Content cartoptimizer/release.json | ConvertFrom-Json).version
          python release/check-windows.py "dist/Sabadchin-Windows-$version.exe" --live
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Sabadchin-Windows-EXE
          path: dist/*.exe
          retention-days: 90
  publish:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Sabadchin-Windows-EXE
          path: release-assets
      - name: Prepare and publish both downloads
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RUN: '43915730499'
          APK_SHA256: '3623e1e92ed768955edf474ab8df8c9bde4347a387707ca6e4042eb702fa91da'
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("cartoptimizer/release.json"))["version"])')
          tag="v$version"
          draft_exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            if [ "$(jq -r .isDraft existing-release.json)" != true ]; then
              echo "Release $tag is already published; assets are left unchanged."
              exit 0
            fi
            test "$(jq -r .targetCommitish existing-release.json)" = "$GITHUB_SHA"
            draft_exists=true
          fi
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANDROID_RUN/artifacts" --jq '.artifacts[] | select(.name == "Cartwise-Android-APK" and .expired == false) | .id')
          test -n "$artifact"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > android.zip
          unzip -q android.zip -d android-download
          cp "android-download/Cartwise-Android-$version-debug.apk" "release-assets/Sabadchin-Android-$version.apk"
          echo "$APK_SHA256  release-assets/Sabadchin-Android-$version.apk" | sha256sum --check
          python3 release/verify-release.py "release-assets/Sabadchin-Android-$version.apk"
          (cd release-assets && sha256sum *.apk *.exe > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          نسخهٔ آزمایشی سبدچین ۰٫۲۰٫۰

          - اتصال اختیاری حساب از صفحهٔ رسمی جت؛ نگهداری نشست در فضای خصوصی همین دستگاه و استفادهٔ دوباره در جست‌وجوهای بعدی. رمز، کد ورود و دادهٔ نشست وارد رابط یا فایل پشتیبان نمی‌شوند.
          - خواندن هزینه‌های سبد موجود حساب بدون افزودن یا حذف کالا؛ تأیید مبلغ فقط با تطبیق کالاها، تعداد و نشانی. قطع اتصال حساب، لیست‌ها و نشانی را نگه می‌دارد.
          - تأمین یک قلم از چند محصول یا برند: مثلاً دو تن ماهی شگفت‌انگیز متفاوت و یک تن ماهی تخفیف‌دار. قیمت واحد میانگین برای کل همان درخواست محاسبه می‌شود.
          - رعایت تعداد داخل پک‌ها بدون خرید اضافه در درخواست‌های عددی، سهمیهٔ مشترک شگفت‌انگیز، قیمت تخفیف‌دار پس از سهمیه، محدودیت تعداد فروشگاه‌ها و هزینهٔ هر سفارش.
          - نمایش تمام اجزای ترکیب با تعداد، فروشگاه، تصویر و قیمت؛ حفظ انتخاب دستی تا بازنشانی با انتخاب کاربر.

          آزمون‌های صفحات نمونه، ماندگاری و انقضای نشست و پاک‌کردن آن را بررسی می‌کنند؛ ورود واقعی و هزینه‌های حساب شخصی هنوز به آزمون روی دستگاه با حساب مالک نیاز دارند. برنامه سبد حساب را خودش پر نمی‌کند، سفارش یا پرداخت ثبت نمی‌کند و هزینه‌های ناخوانده را صفر فرض نمی‌کند. در مسائل بزرگ، محاسبه محدود به بودجهٔ زمانی/سخت‌افزار است و کامل‌نشدن بررسی نمایش داده می‌شود.

          ویندوز به Chrome یا Edge نیاز دارد. داده‌های فعلی در پوشهٔ خصوصی برنامه با تعویض EXE حفظ می‌شوند؛ برای خروج، پنجرهٔ کنسول برنامه را ببندید.
          این APK امضای آزمایشی موقت دارد و ممکن است روی APK آزمایشی قبلی نصب نشود. قبل از حذف نسخهٔ قبلی پشتیبان بگیرید؛ پشتیبان نسخه‌های پیشین ممکن است فقط لیست باز را شامل شود، پس هر لیست موردنیاز را جدا ذخیره کنید.
          EXE امضای ناشر ویندوز ندارد. این خروجی‌ها نسخهٔ رسمی بازار یا Google Play نیستند.
          NOTES
          if [ "$draft_exists" = false ]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sabadchin $version" --notes-file release-notes.md --draft --prerelease
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*.apk release-assets/*.exe release-assets/SHA256SUMS.txt
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
