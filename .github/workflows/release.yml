name: Downloadable release
on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/**']
    paths:
      - '.github/workflows/release.yml'
      - 'release/windows-entry.py'
      - 'release/check-windows.py'
      - 'cartoptimizer/release.json'
permissions:
  contents: read
concurrency:
  group: downloadable-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install ".[live]" pyinstaller==6.22.3
      - name: Ensure the test browser is available
        run: python -m playwright install msedge
      - name: Build portable Windows executable
        shell: pwsh
        run: |
          $version = (Get-Content cartoptimizer/release.json | ConvertFrom-Json).version
          python -m PyInstaller --noconfirm --clean --onefile --console --noupx --name "Sabadchin-Windows-$version" --collect-all cartoptimizer --collect-all playwright release/windows-entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the packaged executable
        shell: pwsh
        run: |
          $version = (Get-Content cartoptimizer/release.json | ConvertFrom-Json).version
          python release/check-windows.py "dist/Sabadchin-Windows-$version.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check live retrieval through the packaged Windows server
        continue-on-error: true
        shell: pwsh
        run: |
          $version = (Get-Content cartoptimizer/release.json | ConvertFrom-Json).version
          python release/check-windows.py "dist/Sabadchin-Windows-$version.exe" --live
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Sabadchin-Windows-EXE
          path: dist/*.exe
          retention-days: 90
  publish:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Sabadchin-Windows-EXE
          path: release-assets
      - name: Prepare and publish both downloads
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RUN: '43870251199'
          APK_SHA256: '8347048f8df2c6e66ba3fb692dd3fd9c0c10d3d746b3259f587e355588324949'
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("cartoptimizer/release.json"))["version"])')
          tag="v$version"
          draft_exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            if [ "$(jq -r .isDraft existing-release.json)" != true ]; then
              echo "Release $tag is already published; assets are left unchanged."
              exit 0
            fi
            test "$(jq -r .targetCommitish existing-release.json)" = "$GITHUB_SHA"
            draft_exists=true
          fi
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANDROID_RUN/artifacts" --jq '.artifacts[] | select(.name == "Cartwise-Android-APK" and .expired == false) | .id')
          test -n "$artifact"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > android.zip
          unzip -q android.zip -d android-download
          cp "android-download/Cartwise-Android-$version-debug.apk" "release-assets/Sabadchin-Android-$version.apk"
          echo "$APK_SHA256  release-assets/Sabadchin-Android-$version.apk" | sha256sum --check
          python3 release/verify-release.py "release-assets/Sabadchin-Android-$version.apk"
          (cd release-assets && sha256sum *.apk *.exe > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          نسخهٔ آزمایشی سبدچین ۰٫۱۸٫۰

          - افزایش سقف جست‌وجوی موازی به ۳۰ صفحه در دسکتاپ و اندروید، با حفظ کاهش خودکار هنگام فشار حافظه یا کندی رابط. تعداد فعال به حافظه، پردازنده و صف کار وابسته است.
          - رفع نمایش چند فروشگاه پس از انتخاب «یک فروشگاه در هر گروه»: کالاهای بدون سبد معتبر جدا و روشن نمایش داده می‌شوند؛ محدودیت انتخاب‌شده دور زده نمی‌شود.
          - گزینه‌های ناموجود غیرفعال هستند و نشانگر انتظار ماوس ندارند.
          - نگهداری هزینه‌های عمومی هر فروشگاه تا هفت روز، وابسته به آدرس و روش تحویل و با حفظ زمان واقعی خواندن هر هزینه. سبد واقعی همچنان اعتبار کوتاه‌تر دارد.
          - دکمهٔ بررسی به‌روزرسانی در تنظیمات؛ نصب مستقیم از GitHub و نصب‌های بازار/پلی از فروشگاه اصلی خود پیگیری می‌شوند. نصب خودکار انجام نمی‌شود.
          - چیدمان خواناتر سبدها، کارت‌های کالا و هزینه‌ها، با حفظ سه ظاهر، حالت شب، پنج زبان و لیست‌های ذخیره‌شده.
          - مسیر ساخت APK/AAB با امضای دائمی مالک و بررسی تطابق فایل‌های مشترک آماده شده است؛ پیکربندی ناشر هنوز لازم است.

          هزینه‌های جانبی که جت فقط در سبد واقعی اعلام می‌کند همچنان «تأیید نشده» می‌مانند؛ صفر فرض نمی‌شوند. بررسی زنده با موقعیت عمومی و حساب مهمان انجام شد: ورود برای سبد لازم بود و API اعتبارسنجی مهمان HTTP 500 برگرداند. استخراج کامل هزینه‌های سبد حساب واردشده هنوز تأیید نشده است.
          شبیه‌ساز Android 16 در زیرساخت آزمون قطع می‌شود؛ این مورد آزمون موفق محسوب نمی‌شود. وضعیت دقیق کنترل‌ها در PR #16 و GitHub Actions ثبت شده است.

          برای ویندوز Chrome یا Edge نصب باشد. فایل EXE رابط وب برنامه را باز می‌کند؛ برای خروج، پنجرهٔ کنسول برنامه را ببندید.
          APK امضای آزمایشی موقت دارد و ممکن است روی APK آزمایشی قبلی نصب نشود؛ قبل از حذف نسخهٔ قبلی از داده‌های لازم پشتیبان بگیرید. EXE امضای ناشر ویندوز ندارد. این خروجی‌ها نسخهٔ رسمی بازار یا Google Play نیستند.
          انتشار رسمی و آپدیت پایدار اندروید به اطلاعات عمومی ناشر، امضای دائمی یکسان، بررسی زندهٔ گوشی و تکمیل پنل‌های فروشگاه نیاز دارد. برنامه سفارش یا پرداخت ثبت نمی‌کند.
          NOTES
          if [ "$draft_exists" = false ]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sabadchin $version" --notes-file release-notes.md --draft --prerelease
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*.apk release-assets/*.exe release-assets/SHA256SUMS.txt
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
