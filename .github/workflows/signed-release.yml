name: Signed store packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cartoptimizer/release.json, release/publication.json]
permissions:
  contents: read
concurrency:
  group: signed-store-packages
  cancel-in-progress: false
jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if python release/check-publication.py; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Signed store packages await the owner publisher/signing checklist.' >> "$GITHUB_STEP_SUMMARY"
            if [ "$EVENT_NAME" = workflow_dispatch ]; then exit 1; fi
          fi
  package:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check publisher information
        run: python release/check-publication.py
      - name: Restore publisher key into temporary private storage
        env:
          KEY_BASE64: ${{ secrets.CARTWISE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_BASE64"
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/sabadchin.jks"
      - name: Build signed APK and AAB
        working-directory: android
        env:
          CARTWISE_KEYSTORE_PATH: ${{ runner.temp }}/sabadchin.jks
          CARTWISE_KEYSTORE_PASSWORD: ${{ secrets.CARTWISE_KEYSTORE_PASSWORD }}
          CARTWISE_KEY_PASSWORD: ${{ secrets.CARTWISE_KEY_PASSWORD }}
          CARTWISE_KEY_ALIAS: ${{ secrets.CARTWISE_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease bundleRelease lintRelease
      - name: Verify signatures and version
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > signing-certificate.txt
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          python release/verify-release.py android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/*.apk android/app/build/outputs/bundle/release/*.aab > SHA256SUMS.txt
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sabadchin.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Sabadchin-Signed-Store-Packages
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            signing-certificate.txt
            SHA256SUMS.txt
          retention-days: 30
